url: https://github.com/WsTe47/dsh-tab-status
name: WsTe47/dsh-tab-status
category: ui
description:
  en: Puts the workspace state into the browser tab title as a readable prefix naming the state and its count (waiting on you, running, or finished while you were away), and badges the tab icon for the two states that want attention.
  zh: 把工作区状态写成浏览器标签标题上的可读前缀（待处理 / 进行中 / 已完成，各带条数），并为其中两种需要你留意的状态在标签图标上加上计数徽章。
